# wrangler.toml — Cloudflare Worker (Static Assets) for koPaper.
# Build:  npm run build        -> produces dist/ + dist/_worker.js/index.js
# Deploy: npx wrangler deploy  (Worker command; matches the working template)
name = 'www-kopaper-com'
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
main = "./dist/_worker.js/index.js"
assets = { directory = "./dist", binding = "ASSETS" }

# Workers AI binding (free daily neuron allowance) — native image generation, no external network/captcha.
[ai]
binding = "AI"

# Production secrets live in the Cloudflare dashboard (Settings -> Environment variables):
#   OPENROUTER_API_KEY  only needed for the paid OpenRouter provider; absent -> free providers
#   IMAGE_PROVIDER      "workersai" (default) | "pollinations" | "openrouter"
