  <polygon points="210,70 70,300 350,300" fill="#fff7ed" stroke="#334155" stroke-width="3"/>
  <!-- tail folded to the side -->
  <polygon points="250,300 350,300 345,238" fill="#ffedd5" stroke="#334155" stroke-width="2"/>
  <line x1="210" y1="300" x2="345" y2="238" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
  <circle cx="40" cy="40" r="22" fill="#7c3aed"/>
  <text x="40" y="47" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">2</text>
</svg>
