<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-label="Step 4: fold the top point down a little, then fold the paper in half vertically">
  <rect width="420" height="380" fill="#ffffff"/>
  <!-- upper remaining triangle -->
  <polygon points="210,70 155,160 265,160" fill="#fff7ed" stroke="#334155" stroke-width="3"/>
  <!-- folded-up flap -->
  <polygon points="155,160 265,160 210,20" fill="#ffedd5" stroke="#334155" stroke-width="3"/>
  <!-- top point folded down ~1cm -->
  <polygon points="210,20 198,46 222,46" fill="#fed7aa" stroke="#334155" stroke-width="2"/>
  <!-- vertical half-fold crease -->
  <line x1="210" y1="20" x2="210" y2="160" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
  <circle cx="40" cy="40" r="22" fill="#7c3aed"/>
  <text x="40" y="47" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">4</text>
</svg>
