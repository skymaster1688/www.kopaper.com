  <path d="M210 160 C260 165 310 200 280 235 C245 255 215 205 210 185 Z" fill="#fed7aa" stroke="#334155" stroke-width="3"/>
  <!-- antennae -->
  <path d="M210 70 C200 50 190 42 178 40" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M210 70 C220 50 230 42 242 40" fill="none" stroke="#334155" stroke-width="2"/>
  <circle cx="40" cy="40" r="22" fill="#7c3aed"/>
