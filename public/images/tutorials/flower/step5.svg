<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" role="img" aria-label="Step 5: fold the outer petal edges inward to the center line">
  <rect width="420" height="360" fill="#ffffff"/>
  <polygon points="210,70 120,185 210,300 300,185" fill="#fff7ed" stroke="#334155" stroke-width="3"/>
  <!-- refined petals with edges folded in -->
  <polygon points="210,70 140,160 175,210 200,150" fill="#ffedd5" stroke="#334155" stroke-width="2"/>
  <polygon points="210,70 280,160 245,210 220,150" fill="#ffedd5" stroke="#334155" stroke-width="2"/>
  <line x1="210" y1="70" x2="210" y2="300" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
  <circle cx="40" cy="40" r="22" fill="#7c3aed"/>
  <text x="40" y="47" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">5</text>
</svg>
