<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" role="img" aria-label="Finished paper cat">
  <rect width="420" height="360" fill="#ffffff"/>
  <!-- tail -->
  <path d="M292 282 Q362 252 330 188" fill="none" stroke="#334155" stroke-width="6"/>
  <!-- body -->
  <ellipse cx="210" cy="252" rx="86" ry="72" fill="#fff7ed" stroke="#334155" stroke-width="3"/>
  <!-- head -->
  <circle cx="210" cy="150" r="62" fill="#fff7ed" stroke="#334155" stroke-width="3"/>
  <!-- ears -->
  <polygon points="158,112 148,54 206,96" fill="#ffedd5" stroke="#334155" stroke-width="3"/>
  <polygon points="262,112 272,54 214,96" fill="#ffedd5" stroke="#334155" stroke-width="3"/>
  <!-- eyes -->
  <circle cx="187" cy="146" r="8" fill="#334155"/>
  <circle cx="233" cy="146" r="8" fill="#334155"/>
  <!-- nose -->
  <polygon points="210,162 201,170 219,170" fill="#fed7aa" stroke="#334155" stroke-width="2"/>
  <!-- whiskers -->
  <line x1="150" y1="160" x2="195" y2="166" stroke="#334155" stroke-width="2"/>
  <line x1="150" y1="172" x2="195" y2="174" stroke="#334155" stroke-width="2"/>
  <line x1="270" y1="160" x2="225" y2="166" stroke="#334155" stroke-width="2"/>
  <line x1="270" y1="172" x2="225" y2="174" stroke="#334155" stroke-width="2"/>
</svg>
