<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" role="img" aria-label="Finished origami fox">
  <rect width="420" height="360" fill="#ffffff"/>
  <!-- ears -->
  <polygon points="95,170 150,70 178,175" fill="#ffedd5" stroke="#334155" stroke-width="3"/>
  <polygon points="325,170 270,70 242,175" fill="#ffedd5" stroke="#334155" stroke-width="3"/>
  <polygon points="120,160 150,100 165,165" fill="#fed7aa" stroke="#334155" stroke-width="2"/>
  <polygon points="300,160 270,100 255,165" fill="#fed7aa" stroke="#334155" stroke-width="2"/>
  <!-- face -->
  <polygon points="150,165 270,165 210,300" fill="#fed7aa" stroke="#334155" stroke-width="3"/>
  <!-- snout -->
  <polygon points="210,245 182,300 238,300" fill="#fff7ed" stroke="#334155" stroke-width="2"/>
  <!-- eyes -->
  <circle cx="185" cy="205" r="6" fill="#334155"/>
  <circle cx="235" cy="205" r="6" fill="#334155"/>
  <!-- nose -->
  <circle cx="210" cy="292" r="7" fill="#334155"/>
</svg>
