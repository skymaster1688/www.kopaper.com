<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" role="img" aria-label="Finished jumping origami frog">
  <rect width="420" height="360" fill="#ffffff"/>
  <!-- back legs -->
  <ellipse cx="95" cy="250" rx="42" ry="22" fill="#86efac" stroke="#334155" stroke-width="3"/>
  <ellipse cx="325" cy="250" rx="42" ry="22" fill="#86efac" stroke="#334155" stroke-width="3"/>
  <!-- body -->
  <ellipse cx="210" cy="215" rx="92" ry="78" fill="#bbf7d0" stroke="#334155" stroke-width="3"/>
  <!-- eyes -->
  <circle cx="170" cy="142" r="30" fill="#bbf7d0" stroke="#334155" stroke-width="3"/>
  <circle cx="250" cy="142" r="30" fill="#bbf7d0" stroke="#334155" stroke-width="3"/>
  <circle cx="170" cy="142" r="13" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <circle cx="250" cy="142" r="13" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <circle cx="170" cy="145" r="6" fill="#334155"/>
  <circle cx="250" cy="145" r="6" fill="#334155"/>
  <!-- mouth -->
  <path d="M160 235 Q210 270 260 235" fill="none" stroke="#334155" stroke-width="3"/>
  <!-- front feet -->
  <ellipse cx="165" cy="288" rx="24" ry="12" fill="#86efac" stroke="#334155" stroke-width="2"/>
  <ellipse cx="255" cy="288" rx="24" ry="12" fill="#86efac" stroke="#334155" stroke-width="2"/>
</svg>
