<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" role="img" aria-label="Step 4: fold the left and right edges to the center line">
  <rect width="420" height="360" fill="#ffffff"/>
  <polygon points="90,90 330,90 210,300" fill="#fff7ed" stroke="#334155" stroke-width="3"/>
  <line x1="210" y1="90" x2="210" y2="300" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
  <!-- sides folded to center -->
  <polygon points="90,90 150,90 120,175" fill="#ffedd5" stroke="#334155" stroke-width="2"/>
  <polygon points="330,90 270,90 300,175" fill="#ffedd5" stroke="#334155" stroke-width="2"/>
  <circle cx="40" cy="40" r="22" fill="#7c3aed"/>
  <text x="40" y="47" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">4</text>
</svg>
