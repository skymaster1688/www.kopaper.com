<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" role="img" aria-label="Finished paper hat">
  <rect width="420" height="360" fill="#ffffff"/>
  <!-- crown -->
  <polygon points="150,110 270,110 230,225 190,225" fill="#fff7ed" stroke="#334155" stroke-width="3"/>
  <!-- brim -->
  <polygon points="105,225 315,225 288,258 132,258" fill="#fde9d3" stroke="#334155" stroke-width="3"/>
  <!-- newspaper hint lines -->
  <line x1="170" y1="140" x2="250" y2="140" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="165" y1="160" x2="255" y2="160" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="175" y1="180" x2="245" y2="180" stroke="#cbd5e1" stroke-width="3"/>
</svg>
